name: Keep Streamlit Alive

on:
  workflow_dispatch: {}
  schedule:
    # Every 8 hours
    - cron: "0 0,8,16 * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --silent --show-error --fail --max-time 30 --output /dev/null "${{ secrets.STREAMLIT_URL }}"
