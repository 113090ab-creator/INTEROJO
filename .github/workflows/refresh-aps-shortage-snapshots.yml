name: Refresh APS shortage snapshots

on:
  workflow_dispatch: {}
  schedule:
    # KST 07:25-08:00, every 5 minutes around the 07:30 APS refresh slot.
    - cron: "25,30,35,40,45,50,55 22 * * *"
    - cron: "0 23 * * *"
    # KST 15:55-16:30, every 5 minutes around the 16:00 APS refresh slot.
    - cron: "55 6 * * *"
    - cron: "0,5,10,15,20,25,30 7 * * *"

permissions:
  contents: write

concurrency:
  group: aps-shortage-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      INTEROJO_FORCE_PLAN_API: "1"
      PLAN_API_KEY: ${{ secrets.PLAN_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh APS WIP and shortage snapshots
        run: python scripts/refresh_aps_shortage_snapshots.py --scheduled --only-if-stale

      - name: Commit updated APS snapshots and logs
        run: |
          if git diff --quiet -- cloud_snapshots; then
            echo "No APS snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots
          git commit -m "Refresh APS shortage snapshots"
          git push
