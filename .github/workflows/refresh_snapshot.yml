name: Refresh APS snapshots

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated site filters"
        required: false
        default: "C관,A관,S관,전체"
  schedule:
    # KST 08:00-09:55. Each run is short: check readiness, publish only when PLAN/WIP slots match.
    - cron: "*/5 23,0 * * *"
    # KST 16:00-17:55. Avoid holding a runner with long sleep while PLAN/WIP delivery is staggered.
    - cron: "*/5 7,8 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-aps-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INTEROJO_FORCE_PLAN_API: "1"
      INTEROJO_DISABLE_LOCAL_SECRET_DISCOVERY: "1"
      PLAN_API_KEY: ${{ secrets.PLAN_API_KEY }}
      PLAN_API_BASE_URL: ${{ secrets.PLAN_API_BASE_URL || 'https://plan.interojo.net' }}
      PLAN_API_TIMEOUT_SECONDS: "30"
      APS_WIP_API_TIMEOUT_SECONDS: "180"
      PLAN_API_RETRY_ATTEMPTS: "2"
      SNAPSHOT_WAIT_DELAY_MINUTES: "60"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest snapshots
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh APS snapshots
        id: refresh
        continue-on-error: true
        shell: bash
        run: |
          python scripts/refresh_snapshot.py \
            --only-if-stale \
            --sites "${{ github.event.inputs.sites || 'C관,A관,S관,전체' }}"

      - name: Commit refreshed snapshots and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          refresh_outcome="${{ steps.refresh.outcome }}"
          echo "Snapshot git status before commit:"
          git status --short -- cloud_snapshots || true
          if git diff --quiet -- cloud_snapshots; then
            echo "No APS snapshot changes to commit."
            python scripts/report_snapshot_status.py || true
            exit 0
          fi
          echo "Changed snapshot files:"
          git diff --name-only -- cloud_snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$refresh_outcome" = "failure" ]; then
            echo "Refresh failed; committing status only and leaving any partial data files unpublished."
            git add cloud_snapshots/aps_snapshot_refresh_status.json
          else
            git add cloud_snapshots
          fi
          if git diff --cached --quiet; then
            echo "No staged APS snapshot changes to commit."
            python scripts/report_snapshot_status.py || true
            exit 0
          fi
          git commit -m "Refresh APS snapshots"
          echo "Created commit: $(git rev-parse --short HEAD)"
          git push origin HEAD:main
          echo "Pushed refreshed snapshots to main."
          python scripts/report_snapshot_status.py || true

      - name: Fail when refresh failed
        if: steps.refresh.outcome == 'failure'
        run: exit 1
