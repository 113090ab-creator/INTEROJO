name: Refresh APS snapshots

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated site filters"
        required: false
        default: "C관,A관,S관,전체"
  schedule:
    # KST weekdays 08:20-08:50 = UTC previous-day 23:20-23:50.
    # Morning WIP usually arrives after 08:10, so start after the data is likely ready.
    - cron: "20,25,30,35,40,45,50 23 * * 0-4"
    # KST weekdays 16:30-17:00 = UTC weekdays 07:30-08:00.
    # APS 오후 갱신 완료 후 5분 간격으로 재시도하고, 이미 최신이면 건너뜁니다.
    - cron: "30,35,40,45,50,55 7 * * 1-5"
    - cron: "0 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-aps-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      INTEROJO_FORCE_PLAN_API: "1"
      INTEROJO_DISABLE_LOCAL_SECRET_DISCOVERY: "1"
      PLAN_API_KEY: ${{ secrets.PLAN_API_KEY }}
      PLAN_API_BASE_URL: ${{ secrets.PLAN_API_BASE_URL || 'https://plan.interojo.net' }}
      PLAN_API_TIMEOUT_SECONDS: "30"
      APS_WIP_API_TIMEOUT_SECONDS: "180"
      PLAN_API_RETRY_ATTEMPTS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh APS snapshots
        id: refresh
        continue-on-error: true
        run: >-
          python scripts/refresh_snapshot.py
          --only-if-stale
          --sites "${{ github.event.inputs.sites || 'C관,A관,S관,전체' }}"

      - name: Commit refreshed snapshots and status
        if: always()
        run: |
          if git diff --quiet -- cloud_snapshots; then
            echo "No APS snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots
          git commit -m "Refresh APS snapshots"
          git push

      - name: Fail when refresh failed
        if: steps.refresh.outcome == 'failure'
        run: exit 1
