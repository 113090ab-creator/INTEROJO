name: Refresh APS snapshots

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Comma-separated site filters"
        required: false
        default: "C관,A관,S관,전체"
  schedule:
    # KST every day 08:20 = UTC previous-day 23:20.
    # Morning WIP usually arrives after 08:10, so start after the data is likely ready.
    - cron: "20 23 * * *"
    # KST every day 16:30 = UTC same-day 07:30.
    # APS 오후 갱신 완료 후 5분 간격으로 재시도하고, 이미 최신이면 건너뜁니다.
    - cron: "30 7 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-aps-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INTEROJO_FORCE_PLAN_API: "1"
      INTEROJO_DISABLE_LOCAL_SECRET_DISCOVERY: "1"
      PLAN_API_KEY: ${{ secrets.PLAN_API_KEY }}
      PLAN_API_BASE_URL: ${{ secrets.PLAN_API_BASE_URL || 'https://plan.interojo.net' }}
      PLAN_API_TIMEOUT_SECONDS: "30"
      APS_WIP_API_TIMEOUT_SECONDS: "180"
      PLAN_API_RETRY_ATTEMPTS: "2"
      SNAPSHOT_REFRESH_MAX_ATTEMPTS: "13"
      SNAPSHOT_REFRESH_RETRY_SECONDS: "300"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest snapshots
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh APS snapshots
        id: refresh
        continue-on-error: true
        shell: bash
        run: |
          status=1
          for attempt in $(seq 1 "$SNAPSHOT_REFRESH_MAX_ATTEMPTS"); do
            echo "APS snapshot refresh attempt ${attempt}/${SNAPSHOT_REFRESH_MAX_ATTEMPTS}"
            python scripts/refresh_snapshot.py \
              --only-if-stale \
              --sites "${{ github.event.inputs.sites || 'C관,A관,S관,전체' }}"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt "$SNAPSHOT_REFRESH_MAX_ATTEMPTS" ]; then
              echo "APS snapshot refresh failed or pending; retrying in ${SNAPSHOT_REFRESH_RETRY_SECONDS} seconds."
              sleep "$SNAPSHOT_REFRESH_RETRY_SECONDS"
            fi
          done
          exit "$status"

      - name: Commit refreshed snapshots and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Snapshot git status before commit:"
          git status --short -- cloud_snapshots || true
          if git diff --quiet -- cloud_snapshots; then
            echo "No APS snapshot changes to commit."
            python scripts/report_snapshot_status.py || true
            exit 0
          fi
          echo "Changed snapshot files:"
          git diff --name-only -- cloud_snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots
          git commit -m "Refresh APS snapshots"
          echo "Created commit: $(git rev-parse --short HEAD)"
          git push origin HEAD:main
          echo "Pushed refreshed snapshots to main."
          python scripts/report_snapshot_status.py || true

      - name: Fail when refresh failed
        if: steps.refresh.outcome == 'failure'
        run: exit 1
