name: Verify live APS snapshot

on:
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read

concurrency:
  group: verify-live-aps-snapshot
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STREAMLIT_URL: ${{ secrets.STREAMLIT_URL || 'https://interojo-2.streamlit.app/' }}
    steps:
      - name: Check out current published pointer and probe
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_app_snapshot.py
            /cloud_snapshots/current_snapshot_set.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser probe
        run: |
          python -m pip install 'playwright>=1.56,<2'
          python -m playwright install --with-deps chromium
      - name: Verify published snapshot is visible in the live app
        run: python scripts/check_app_snapshot.py --report outputs/live_snapshot_check.json
      - name: Save verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-snapshot-check
          path: outputs/live_snapshot_check.json
          if-no-files-found: ignore
          retention-days: 14
