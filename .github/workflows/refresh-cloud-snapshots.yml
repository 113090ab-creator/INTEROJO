name: Refresh cloud snapshots

on:
  push:
    branches:
      - main
    paths:
      - "*.xlsx"
      - "app.py"
      - "requirements.txt"
      - "scripts/refresh_cloud_snapshots.py"
      - ".github/workflows/refresh-cloud-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh cloud snapshots
        run: python scripts/refresh_cloud_snapshots.py

      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- cloud_snapshots; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots
          git commit -m "Refresh cloud snapshots"
          git push
